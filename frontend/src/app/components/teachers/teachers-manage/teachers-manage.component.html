<div class="sm-wrap">
  <header *ngIf="showManageTabs()" class="sm-header">
    <h1 class="sm-title">Teacher Manager</h1>
    <p class="sm-sub">Add teachers, assign classes, and use the admin record book</p>
  </header>

  <nav *ngIf="showManageTabs()" class="sm-tabs" aria-label="Teacher manager sections">
    <a
      routerLink="/teachers/manage/add-new"
      routerLinkActive="active"
      class="sm-tab sm-tab--btn"
    >
      <span class="sm-tab-ico" aria-hidden="true">📝</span>
      Add New
    </a>
    <a
      routerLink="/assign-classes"
      routerLinkActive="active"
      class="sm-tab"
    >
      <span class="sm-tab-ico" aria-hidden="true">🗂️</span>
      Assign Classes
    </a>
    <a
      routerLink="/teacher_subject"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
      class="sm-tab"
    >
      <span class="sm-tab-ico" aria-hidden="true">📚</span>
      Teacher Subject Assignment
    </a>
    <a
      routerLink="/teachers/manage/record-book"
      routerLinkActive="active"
      class="sm-tab"
    >
      <span class="sm-tab-ico" aria-hidden="true">📘</span>
      Record Book
    </a>
  </nav>

  <div class="sm-outlet">
    <router-outlet></router-outlet>
  </div>
</div>
